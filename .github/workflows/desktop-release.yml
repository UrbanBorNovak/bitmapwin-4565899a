name: Release Desktop App

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate icons
        # RGBA source: tauri-build refuses RGB-only icons.
        run: cargo tauri icon src-tauri/app-icon.png -o src-tauri/icons
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          # Manual runs from main would otherwise create a tag literally named "main".
          tagName: desktop-v__VERSION__
          releaseName: "BitmapWIN Desktop v__VERSION__"
          releaseBody: "Windows x64 installer. Opens bitmapwin.app in its own window."
          releaseDraft: true
